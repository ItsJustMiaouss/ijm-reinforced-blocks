plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "2.2.1"
}

repositories {

}

base {
	archivesName = project.archives_base_name
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "ijmreinforced"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def properties = [
			"version": project.version,
			"minecraft_min": minecraft_min,
			"fabric_api_min": fabric_api_min
	]

	inputs.properties(properties)

	filesMatching("fabric.mod.json") {
		expand(properties)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishMods {
	file = tasks.named("jar").flatMap()
	displayName = file.map { it.asFile.name }
	changelog = rootProject.file("CHANGELOG.md").text
	type = STABLE
	modLoaders.add("fabric")

	modrinth {
		projectId = "PIhPIDve"
		accessToken = providers.environmentVariable("modrinthToken")

		minecraftVersionRange {
			start = "26.3"
			end = "26.3"
		}

		requires("fabric-api")
		optional("modmenu")
	}

	curseforge {
		projectId = "1822157"
		accessToken = providers.environmentVariable("curseforgeToken")

		minecraftVersionRange {
			start = "26.3"
			end = "26.3"
		}

		javaVersions.add(JavaVersion.VERSION_25)
		clientRequired = true
		serverRequired = true

		requires("fabric-api")
		optional("modmenu")
	}

	github {
		repository = "ItsJustMiaouss/ijm-reinforced-blocks"
		accessToken = providers.gradleProperty("githubToken")
		commitish = "26.3"
		tagName = "v${project.version}"
	}
}
